name: pipeline

on:
  push:                    # 코드·설정이 바뀌면 자동 실행 (지역은 저장소 변수 REGION, 없으면 test)
    branches: [main]
    paths: ['pipeline/**', 'site/**', 'config.yaml', 'data/seed/**', '.github/workflows/pipeline.yml', '!pipeline/diag.py']
  workflow_dispatch:
    inputs:
      region:
        description: 'config.yaml 지역 키 또는 시군구코드 (예: test / seoul / seoul,seongnam / 11650)'
        default: test
  schedule:
    - cron: '0 18 1 * *'   # 매월 2일 03:00 KST

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: { group: pipeline, cancel-in-progress: true }

jobs:
  build:
    runs-on: ubuntu-latest                  # 브이월드는 해외 IP 차단 → data/seed(직접 올린 파일) 사용. 국내 서버 생기면 [self-hosted, korea]
    timeout-minutes: 350
    env:
      REGION: ${{ inputs.region || vars.REGION || 'test' }}
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v4
      - name: setup
        run: |
          python3 -m venv ~/venv
          ~/venv/bin/pip install -q -r requirements.txt
          echo "$HOME/venv/bin" >> $GITHUB_PATH
      - run: python -m pytest -q tests
      - name: fetch
        run: python -m pipeline.fetch "$REGION" 2>&1 | tee fetch.log; exit ${PIPESTATUS[0]}
        env:
          VWORLD_KEY: ${{ secrets.VWORLD_KEY }}
          VWORLD_DOMAIN: ${{ secrets.VWORLD_DOMAIN }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      - name: build
        if: always()                        # 수집이 일부 실패해도 받은 동까지는 지도에 반영
        run: python -m pipeline.build "$REGION" 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: report                        # 로그 끝부분을 annotation으로 남김 (로그인 없이 API로 조회 가능)
        if: always()
        run: |
          python - <<'EOF'
          import pathlib
          for n in ('fetch', 'build'):
              p = pathlib.Path(f'{n}.log')
              if p.exists():
                  t = p.read_text(errors='replace')[-3000:].replace('%', '%25').replace('\r', '').replace('\n', '%0A')
                  print(f'::notice title={n}.log::{t}')
          EOF
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with: { path: site }

  deploy:
    needs: build
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
