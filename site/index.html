<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>재개발 지도</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
<style>
  :root { --bg:#fff; --fg:#1f2328; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; --ok:#16a34a; --bad:#dc2626; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; font:14px/1.45 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; color:var(--fg); background:var(--bg); }
  #map { position:absolute; inset:0; }
  #bar { position:absolute; top:10px; left:10px; right:10px; display:flex; gap:6px; flex-wrap:wrap; z-index:2; }
  #bar > * { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit; box-shadow:0 1px 4px #0002; }
  #bar b { padding:8px 4px; border:0; box-shadow:none; background:transparent; }
  button { cursor:pointer; }
  button.on { background:var(--accent) !important; color:#fff; border-color:var(--accent) !important; }
  #legend { position:absolute; left:10px; bottom:24px; background:#fffe; border:1px solid var(--line); border-radius:8px; padding:6px 8px; font-size:12px; z-index:2; }
  #legend i { display:inline-block; width:12px; height:12px; border-radius:2px; margin:0 4px 0 8px; vertical-align:-2px; }
  #panel { position:absolute; right:10px; top:60px; width:320px; max-height:calc(100% - 80px); overflow:auto; background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:14px; box-shadow:0 4px 16px #0003; z-index:3; display:none; }
  #panel h3 { margin:0 0 8px; font-size:15px; }
  #panel table { width:100%; border-collapse:collapse; }
  #panel td { padding:5px 0; border-bottom:1px solid var(--line); vertical-align:top; }
  #panel td:last-child { text-align:right; font-variant-numeric:tabular-nums; }
  .badge { display:inline-block; padding:2px 8px; border-radius:99px; color:#fff; font-size:12px; }
  .note { color:var(--muted); font-size:12px; margin-top:8px; }
  #msg { position:absolute; top:58px; left:50%; transform:translateX(-50%); background:#111c; color:#fff; padding:6px 12px; border-radius:99px; font-size:13px; z-index:2; display:none; }
  .maplibregl-popup-content { font-size:13px; line-height:1.5; }
  .steps { display:flex; gap:2px; margin:6px 0 2px; } .steps span { flex:1; height:6px; border-radius:3px; background:#e5e7eb; }
  .stepn { display:flex; justify-content:space-between; font-size:10px; color:var(--muted); }
  .zi { padding:7px 4px; border-bottom:1px solid var(--line); cursor:pointer; } .zi:hover { background:#f3f4f6; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; vertical-align:-1px; }
  .x { position:absolute; right:10px; top:8px; border:0; background:none; font-size:20px; color:var(--muted); }
  .maplibregl-ctrl-group button { width:36px; height:36px; }
  @media (max-width:640px) {
    #panel { left:0; right:0; top:auto; bottom:0; width:auto; max-height:55%; border-radius:14px 14px 0 0; }
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="bar">
  <b>재개발 지도</b>
  <select id="mode">
    <option value="age">노후도</option>
    <option value="own">추정 소유자 수</option>
    <option value="new">최근 신축</option>
    <option value="zone">용도지역</option>
    <option value="far">용적률 사용률 (현재/허용)</option>
  </select>
  <button id="zl">정비사업 목록</button>
  <label style="display:flex;align-items:center;gap:4px"><input type="checkbox" id="zn" checked>정비사업</label>
  <label style="display:flex;align-items:center;gap:4px"><input type="checkbox" id="rz">건축규제구역</label>
  <button id="draw">구역 그리기</button>
  <button id="done" style="display:none">계산</button>
  <button id="clear" style="display:none">지우기</button>
</div>
<div id="msg"></div>
<div id="legend"></div>
<div id="panel"></div>
<script>
const AGING = 0.60, SMALL = 90;   // config.yaml 의 aging_threshold, small_parcel_m2 와 맞출 것
const fc = f => ({ type: 'FeatureCollection', features: f });
const $ = id => document.getElementById(id);
const fmt = n => (n ?? 0).toLocaleString('ko-KR');
const pct = x => isFinite(x) ? (x * 100).toFixed(1) + '%' : '–';
let P = [], loaded = new Set(), dongs, pts = [], drawing = false, V = '0';
const D = f => `data/${f}?v=${V}`;  // 데이터 버전이 같으면 브라우저 캐시(sw.js) 사용

// 용도지역별 건폐율·용적률(%) — 서울시 도시계획 조례 / 국토계획법 시행령 상한
const FAR = {  // [서울 조례 건폐율, 서울 조례 용적률, 법정 상한 건폐율, 법정 상한 용적률]
  '제1종전용주거지역': [50, 100, 50, 100], '제2종전용주거지역': [40, 120, 50, 150], '제1종일반주거지역': [60, 150, 60, 200],
  '제2종일반주거지역': [60, 200, 60, 250], '제3종일반주거지역': [50, 250, 50, 300], '준주거지역': [60, 400, 70, 500],
  '중심상업지역': [60, 1000, 90, 1500], '일반상업지역': [60, 800, 80, 1300], '근린상업지역': [60, 600, 70, 900], '유통상업지역': [60, 600, 80, 1100],
  '전용공업지역': [60, 200, 70, 300], '일반공업지역': [60, 200, 70, 350], '준공업지역': [60, 400, 70, 400],
  '보전녹지지역': [20, 50, 20, 80], '생산녹지지역': [20, 50, 20, 100], '자연녹지지역': [20, 50, 20, 100] };
const seoul = p => String(p).startsWith('11');
const allow = p => { const f = FAR[p.z]; return f ? (seoul(p.p) ? { b: f[0], v: f[1], src: '서울시 조례' } : { b: f[2], v: f[3], src: '법정 상한 · 시 조례로 더 낮을 수 있음' }) : null; };
const allowExpr = ['case', ['==', ['slice', ['get', 'p'], 0, 2], '11'],
  ['match', ['get', 'z'], ...Object.entries(FAR).flatMap(([k, v]) => [k, v[1]]), 0],
  ['match', ['get', 'z'], ...Object.entries(FAR).flatMap(([k, v]) => [k, v[3]]), 0]];

const ratio = e => ['interpolate', ['linear'], e, 0, '#3b82f6', 0.45, '#facc15', AGING, '#f97316', 0.85, '#b91c1c'];
const ZONES = { '제1종전용주거지역':'#bbf7d0', '제2종전용주거지역':'#86efac', '제1종일반주거지역':'#fde68a', '제2종일반주거지역':'#fbbf24',
  '제3종일반주거지역':'#d97706', '준주거지역':'#fb923c', '근린상업지역':'#fca5a5', '일반상업지역':'#f87171', '중심상업지역':'#dc2626',
  '유통상업지역':'#e11d48', '준공업지역':'#a78bfa', '일반공업지역':'#7c3aed', '자연녹지지역':'#4ade80', '생산녹지지역':'#22c55e', '보전녹지지역':'#15803d' };
const MODES = {
  age:  { c: ['case', ['==', ['get', 'nb'], 0], '#d4d4d4', ratio(['/', ['get', 'no'], ['get', 'nb']])],
          lg: [['#3b82f6', '0%'], ['#facc15', '45%'], ['#f97316', '60% 기준'], ['#b91c1c', '85%+'], ['#d4d4d4', '건물 없음']] },
  own:  { c: ['interpolate', ['linear'], ['get', 'ol'], 0, '#e5e7eb', 1, '#c7d2fe', 5, '#818cf8', 20, '#4338ca', 100, '#1e1b4b'],
          lg: [['#c7d2fe', '1'], ['#818cf8', '5'], ['#4338ca', '20'], ['#1e1b4b', '100+']] },
  new:  { c: ['case', ['>', ['get', 'nn'], 0], '#dc2626', ['>', ['get', 'nb'], 0], '#e5e7eb', '#f5f5f5'],
          lg: [['#dc2626', '최근 5년 신축 있음'], ['#e5e7eb', '없음']] },
  zone: { c: ['match', ['get', 'z'], ...Object.entries(ZONES).flat(), '#d4d4d4'],
          lg: Object.entries(ZONES).slice(0, 9).map(([k, v]) => [v, k.replace('지역', '')]) },
  far:  { c: ['case', ['any', ['!', ['has', 'fr']], ['==', allowExpr, 0]], '#e5e7eb',
              ['interpolate', ['linear'], ['/', ['get', 'fr'], allowExpr], 0, '#16a34a', 0.5, '#a3e635', 0.8, '#facc15', 1, '#f97316', 1.3, '#b91c1c']],
          lg: [['#16a34a', '여유 많음'], ['#facc15', '80%'], ['#f97316', '허용치 도달'], ['#b91c1c', '초과(기존 건물)'], ['#e5e7eb', '건물 없음']] },
};

const pm = new pmtiles.Protocol();
maplibregl.addProtocol('pmtiles', pm.tile);
const OSM = { version: 8, glyphs: 'https://protomaps.github.io/basemaps-assets/fonts/{fontstack}/{range}.pbf',  // 예비 배경지도
  sources: { base: { type: 'raster', tileSize: 256, tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], attribution: '© OpenStreetMap' } },
  layers: [{ id: 'base', type: 'raster', source: 'base', paint: { 'raster-saturation': -0.6, 'raster-opacity': 0.8 } }] };
const map = new maplibregl.Map({  // 배경지도: OpenFreeMap (키 없이 무료) → 실패하면 OSM
  container: 'map', center: [127.02, 37.48], zoom: 12, doubleClickZoom: false,
  style: 'https://tiles.openfreemap.org/styles/positron', attributionControl: { customAttribution: '브이월드 · 건축HUB · 서울 열린데이터광장' },
});
let based = false, ready = false;
const fallback = () => { if (based || ready) return; based = true; map.setStyle(OSM); };
map.on('error', () => { if (!map.isStyleLoaded()) fallback(); });
setTimeout(fallback, 8000);
map.on('style.load', () => {  // 배경지도 글자를 한글 이름으로
  for (const l of map.getStyle().layers) if (l.type === 'symbol' && l.layout?.['text-field'] && l.source !== 'zones' && !['p-lb', 'z-lb'].includes(l.id))
    map.setLayoutProperty(l.id, 'text-field', ['coalesce', ['get', 'name:ko'], ['get', 'name']]);
});

map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');   // 확대·축소 버튼
map.addControl(new maplibregl.GeolocateControl({ positionOptions: { enableHighAccuracy: true } }), 'bottom-right');  // 내 위치
map.addControl(new maplibregl.ScaleControl(), 'bottom-right');

// 정비사업 단계 (서울시 도시정비사업 통계 기준)
const STAGES = ['구역지정', '추진위', '조합설립', '건축심의', '사업시행', '관리처분', '이주', '착공', '준공'];
const SCOL = ['#fcd34d', '#fb923c', '#f97316', '#ea580c', '#dc2626', '#be123c', '#9d174d', '#6d28d9', '#374151'];
const scol = i => SCOL[i] ?? '#9ca3af';
const DLAB = [['zd', '구역지정'], ['cm', '추진위 승인'], ['jo', '조합설립 인가'], ['sa', '사업시행 인가'], ['gc', '관리처분 인가'], ['ij', '이주 시작'], ['cs', '착공']];
let Z = [];

function msg(t) { $('msg').textContent = t; $('msg').style.display = t ? 'block' : 'none'; }

function setMode(m) {
  map.setPaintProperty('p-fill', 'fill-color', MODES[m].c);
  $('legend').innerHTML = MODES[m].lg.map(([c, t]) => `<i style="background:${c}"></i>${t}`).join('');
}

async function load(bb) {  // bb=[w,s,e,n] 와 겹치는 동 필지 속성 로드 (구역 그리기 통계용)
  const need = dongs.features.filter(f => { const b = f.properties.b;
    return !loaded.has(f.properties.c) && b[0] < bb[2] && b[2] > bb[0] && b[1] < bb[3] && b[3] > bb[1]; });
  if (!need.length) return;
  msg(`필지 불러오는 중… (${need.length}개 동)`);
  await Promise.all(need.map(async f => {
    loaded.add(f.properties.c);
    try { P.push(...await (await fetch(D(`p/${f.properties.c}.json`))).json()); } catch (e) { loaded.delete(f.properties.c); }
  }));
  msg('');
}

map.on('style.load', async () => {
  if (ready) return; ready = true;  // 배경지도를 예비로 바꿔도 한 번만
  try { V = (await (await fetch('data/version.json', { cache: 'no-store' })).json()).v; } catch (e) {}
  dongs = await (await fetch(D('dongs.geojson'))).json();
  map.addSource('dongs', { type: 'geojson', data: dongs });
  map.addSource('parcels', { type: 'vector', url: 'pmtiles://' + new URL(D('parcels.pmtiles'), location.href).href });
  map.addSource('draw', { type: 'geojson', data: fc([]) });
  map.addLayer({ id: 'd-fill', type: 'fill', source: 'dongs', maxzoom: 14.5,
    paint: { 'fill-color': ['case', ['==', ['get', 'r'], null], '#bbb', ratio(['get', 'r'])], 'fill-opacity': 0.45 } });
  map.addLayer({ id: 'p-fill', type: 'fill', source: 'parcels', 'source-layer': 'parcels', minzoom: 14, paint: { 'fill-opacity': ['interpolate', ['linear'], ['zoom'], 14, 0.75, 18, 0.55] } });
  map.addLayer({ id: 'p-line', type: 'line', source: 'parcels', 'source-layer': 'parcels', minzoom: 14.5,  // 지적도 경계
    paint: { 'line-color': '#4b5563', 'line-opacity': ['interpolate', ['linear'], ['zoom'], 14.5, 0.15, 16, 0.6, 18, 0.85], 'line-width': ['interpolate', ['linear'], ['zoom'], 15, 0.4, 18, 1.1] } });
  map.addLayer({ id: 'p-lb', type: 'symbol', source: 'parcels', 'source-layer': 'lb', minzoom: 17,  // 지번
    layout: { 'text-field': ['get', 'j'], 'text-font': ['Noto Sans Regular'], 'text-size': 11, 'text-allow-overlap': false, 'text-padding': 1 },
    paint: { 'text-color': '#374151', 'text-halo-color': '#fff', 'text-halo-width': 1.2 } });
  map.addLayer({ id: 'd-line', type: 'line', source: 'dongs', paint: { 'line-color': '#374151', 'line-width': ['interpolate', ['linear'], ['zoom'], 11, 0.6, 15, 1.6] } });
  try {  // 건축규제 구역 (브이월드 UD210: 건축허가 제한·높이 지정 등)
    map.addSource('redev', { type: 'geojson', data: await (await fetch(D('redev.geojson'))).json() });
    map.addLayer({ id: 'r-fill', type: 'fill', source: 'redev', paint: { 'fill-color': '#7c3aed', 'fill-opacity': 0.06 } });
    map.addLayer({ id: 'r-line', type: 'line', source: 'redev', paint: { 'line-color': '#7c3aed', 'line-width': 2, 'line-dasharray': [3, 2] } });
    ['r-fill', 'r-line'].forEach(l => map.setLayoutProperty(l, 'visibility', 'none'));
  } catch (e) { $('rz').parentElement.style.display = 'none'; }
  try {  // 정비사업 구역 (대표 지번 위치)
    Z = (await (await fetch(D('zones.geojson'))).json()).features;
    map.addSource('zones', { type: 'geojson', data: fc(Z) });
    map.addLayer({ id: 'z-pt', type: 'circle', source: 'zones', paint: {
      'circle-radius': ['interpolate', ['linear'], ['zoom'], 11, 5, 15, 9],
      'circle-color': ['match', ['get', 'si'], ...SCOL.flatMap((c, i) => [i, c]), '#9ca3af'],
      'circle-stroke-color': '#fff', 'circle-stroke-width': 2 } });
    map.addLayer({ id: 'z-lb', type: 'symbol', source: 'zones', minzoom: 13, layout: {
      'text-field': ['concat', ['get', 'n'], '\n', ['get', 's']], 'text-font': ['Noto Sans Regular'], 'text-size': 12,
      'text-offset': [0, 1.1], 'text-anchor': 'top', 'text-optional': true },
      paint: { 'text-color': '#111827', 'text-halo-color': '#fff', 'text-halo-width': 1.6 } });
  } catch (e) { $('zn').parentElement.style.display = $('zl').style.display = 'none'; }
  map.addLayer({ id: 'dr-fill', type: 'fill', source: 'draw', filter: ['==', '$type', 'Polygon'], paint: { 'fill-color': '#2563eb', 'fill-opacity': 0.12 } });
  map.addLayer({ id: 'dr-line', type: 'line', source: 'draw', paint: { 'line-color': '#2563eb', 'line-width': 2.5, 'line-dasharray': [2, 1] } });
  map.addLayer({ id: 'dr-pt', type: 'circle', source: 'draw', filter: ['==', '$type', 'Point'], paint: { 'circle-radius': 5, 'circle-color': '#2563eb', 'circle-stroke-color': '#fff', 'circle-stroke-width': 2 } });
  setMode('age');
  const b = dongs.features.map(f => f.properties.b);
  if (b.length) map.fitBounds([[Math.min(...b.map(x => x[0])), Math.min(...b.map(x => x[1]))], [Math.max(...b.map(x => x[2])), Math.max(...b.map(x => x[3]))]], { padding: 30, duration: 0 });
});

$('mode').onchange = e => setMode(e.target.value);
$('zn').onchange = e => ['z-pt', 'z-lb'].forEach(l => map.getLayer(l) && map.setLayoutProperty(l, 'visibility', e.target.checked ? 'visible' : 'none'));
$('rz').onchange = e => ['r-fill', 'r-line'].forEach(l => map.getLayer(l) && map.setLayoutProperty(l, 'visibility', e.target.checked ? 'visible' : 'none'));
const zoneInfo = pt => map.getLayer('r-fill') ? map.queryRenderedFeatures(pt, { layers: ['r-fill'] }).map(f => f.properties)
  .map(z => `<br><span style="color:#7c3aed">■ 건축규제 구역 ${({UDX100: '건축허가 제한', UDX200: '건축선·높이 등', UDX999: '기타'})[z.cd] || z.cd}${z.nm ? ' · ' + z.nm : ''}${z.dt ? ' · 고시 ' + z.dt.replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3') : ''}</span>`).join('') : '';

// ---------- 팝업 ----------
map.on('click', e => {
  if (drawing) { pts.push([e.lngLat.lng, e.lngLat.lat]); renderDraw(); return; }
  const z = map.getLayer('z-pt') && map.queryRenderedFeatures(e.point, { layers: ['z-pt'] })[0];
  if (z) return zonePopup(z);
  const p0 = map.queryRenderedFeatures(e.point, { layers: ['p-fill'] })[0]?.properties;
  const p = p0 && { nb: 0, no: 0, nu: 0, hh: 0, ho: 0, gj: 0, ar: 0, jm: '', ...p0 };
  const d = map.queryRenderedFeatures(e.point, { layers: ['d-fill'] })[0]?.properties;
  const html = p ? `<b>${p.j}</b> · ${p.z || '용도지역 미상'}<br>면적 ${fmt(p.ar)}㎡ · ${p.jm} · 공시지가 ${fmt(p.gj)}원/㎡<br>
      건물 ${p.nb}동 (노후 ${p.no}, 미상 ${p.nu})${p.y0 ? ` · 준공 ${p.y0}${p.y1 !== p.y0 ? '–' + p.y1 : ''}` : ''}<br>
      세대·가구 ${fmt(p.hh)} · 집합 호수 ${fmt(p.ho)}<br>
      ${farLine(p)}
      추정 소유자 ${p.dp ? `같은 단지 → ${+p.dp.slice(11, 15)}${+p.dp.slice(15) ? '-' + +p.dp.slice(15) : ''}번지에 합산` : p.pub ? '국공유' : p.ol === p.oh ? p.ol + '명' : `${p.ol}~${p.oh}명`}${p.oe ? ' <span style="color:#9ca3af">(대체값)</span>' : ''}
      ${p.cg ? `<br>최근 소유권변동 ${p.cg}` : ''}`
    + zoneInfo(e.point)
    : d ? `<b>${d.n}</b><br>노후도 ${pct(d.r)} (${fmt(d.no)}/${fmt(d.nb)}동)<br>필지 ${fmt(d.np)} · 추정 소유자 ${fmt(d.ol)}명` : null;
  const html2 = html || (zoneInfo(e.point) ? zoneInfo(e.point).slice(4) : null);
  if (html2) new maplibregl.Popup({ maxWidth: '280px' }).setLngLat(e.lngLat).setHTML(html2).addTo(map);
});

function farLine(p) {
  const a = allow(p), cur = p.fr != null ? `현재 용적률 <b>${p.fr}%</b>` : '현재 용적률 –';
  if (!a) return cur + '<br>';
  return `허용 건폐율 ${a.b}% · <b>용적률 ${a.v}%</b> <span style="color:#9ca3af">(${a.src})</span><br>${cur}${p.fr != null ? ` · 여유 ${a.v - p.fr > 0 ? '+' : ''}${a.v - p.fr}%p` : ''}<br>`;
}

// ---------- 정비사업 ----------
function zonePopup(f) {
  const z = f.properties, si = +z.si;
  const hh = z.bh ? `기존 ${fmt(z.eh)}세대 → <b>계획 ${fmt(z.bh)}세대</b>${z.sh || z.rh ? ` (분양 ${fmt(z.sh)} · 임대 ${fmt(z.rh)})` : ''}` : z.eh ? `기존 ${fmt(z.eh)}세대` : '';
  const ds = DLAB.filter(([k]) => z[k]).map(([k, l]) => `<tr><td>${l}</td><td style="text-align:right">${z[k]}</td></tr>`).join('');
  new maplibregl.Popup({ maxWidth: '300px' }).setLngLat(f.geometry.coordinates).setHTML(
    `<b style="font-size:14px">${z.n}</b><br><span style="color:#6b7280">${[z.gu, z.t, z.pp, z.gp].filter(Boolean).join(' · ')}</span>
     <div style="margin-top:6px">현재 단계 <b style="color:${scol(si)}">${z.s || '미상'}</b></div>
     <div class="steps">${STAGES.slice(0, 8).map((s, i) => `<span style="background:${i <= si ? scol(si) : ''}" title="${s}"></span>`).join('')}</div>
     <div class="stepn"><span>구역지정</span><span>조합</span><span>사업시행</span><span>관리처분</span><span>착공</span></div>
     ${hh ? `<div style="margin-top:6px">${hh}</div>` : ''}
     ${ds ? `<table style="width:100%;margin-top:6px;font-size:12px">${ds}</table>` : ''}
     <div style="color:#9ca3af;font-size:11px;margin-top:4px">${z.a || ''}${z.loc === '근처' ? ' (근처 지번에 표시)' : ''}</div>`).addTo(map);
}
function zoneList() {
  const f = $('zf')?.value ?? '';
  const L = Z.filter(x => !f || x.properties.s === f).sort((a, b) => b.properties.si - a.properties.si || a.properties.n.localeCompare(b.properties.n));
  const cnt = STAGES.map(s => [s, Z.filter(x => x.properties.s === s).length]).filter(([, n]) => n);
  $('panel').innerHTML = `<button class="x" onclick="$('panel').style.display='none'">×</button><h3>정비사업 ${fmt(Z.length)}곳</h3>
    <select id="zf" style="width:100%;padding:6px;margin-bottom:6px"><option value="">전체 단계</option>
      ${cnt.map(([s, n]) => `<option ${s === f ? 'selected' : ''} value="${s}">${s} (${n})</option>`).join('')}</select>
    ${L.map((x, i) => `<div class="zi" data-i="${Z.indexOf(x)}"><span class="dot" style="background:${scol(+x.properties.si)}"></span>
      <b>${x.properties.n}</b> <span style="color:#6b7280">${x.properties.s || ''}</span><br>
      <span style="color:#6b7280;font-size:12px">${[x.properties.gu, x.properties.t, x.properties.bh ? '계획 ' + fmt(x.properties.bh) + '세대' : '', x.properties.zd ? '지정 ' + x.properties.zd.slice(0, 4) : ''].filter(Boolean).join(' · ')}</span></div>`).join('')}
    <div class="note">서울시 도시정비사업 통계(분기 갱신) 기준. 아직 수집 안 된 구의 구역은 수집되면 추가됩니다.</div>`;
  $('panel').style.display = 'block';
  $('zf').onchange = zoneList;
  $('panel').querySelectorAll('.zi').forEach(el => el.onclick = () => {
    const x = Z[+el.dataset.i];
    map.flyTo({ center: x.geometry.coordinates, zoom: 16 });
    zonePopup(x);
    if (innerWidth <= 640) $('panel').style.display = 'none';
  });
}
$('zl').onclick = () => $('panel').style.display === 'block' && $('zf') ? $('panel').style.display = 'none' : zoneList();

// ---------- 구역 그리기 ----------
function renderDraw(closed) {
  const f = pts.map(c => ({ type: 'Feature', geometry: { type: 'Point', coordinates: c } }));
  if (pts.length > 1) f.push({ type: 'Feature', geometry: closed ? { type: 'Polygon', coordinates: [[...pts, pts[0]]] } : { type: 'LineString', coordinates: pts } });
  map.getSource('draw').setData(fc(f));
}
$('draw').onclick = () => {
  drawing = !drawing; $('draw').classList.toggle('on', drawing);
  $('done').style.display = $('clear').style.display = drawing ? '' : 'none';
  if (drawing) { pts = []; renderDraw(); $('panel').style.display = 'none'; msg('지도를 눌러 꼭짓점을 찍고 [계산]'); } else msg('');
};
$('clear').onclick = () => { pts = []; renderDraw(); $('panel').style.display = 'none'; };
$('done').onclick = async () => {
  if (pts.length < 3) return msg('꼭짓점을 3개 이상 찍어주세요');
  drawing = false; $('draw').classList.remove('on'); $('done').style.display = 'none';
  renderDraw(true);
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  await load([Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)]);
  showStats([...pts, pts[0]]);
};

function inside(x, y, poly) {
  let c = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c;
  }
  return c;
}
function areaM2(poly) {
  const k = Math.cos(poly[0][1] * Math.PI / 180) * 111320, m = 110540;
  let a = 0;
  for (let i = 0; i < poly.length - 1; i++) a += poly[i][0] * k * poly[i + 1][1] * m - poly[i + 1][0] * k * poly[i][1] * m;
  return Math.abs(a / 2);
}

function showStats(poly) {
  const S = P.map(f => f.properties).filter(p => inside(p.cx, p.cy, poly));
  const sum = (k, a = S) => a.reduce((s, p) => s + (p[k] || 0), 0);
  const nb = sum('nb'), no = sum('no'), nu = sum('nu'), ha = areaM2(poly) / 1e4;
  const dae = S.filter(p => p.jm === '대'), small = dae.filter(p => p.ar < SMALL).length;
  const ar = sum('ar'), pubAr = sum('ar', S.filter(p => p.pub));
  const lo = sum('ol'), hi = sum('oh'), est = S.filter(p => p.oe).length;
  const zones = Object.entries(S.reduce((z, p) => (z[p.z || '미상'] = (z[p.z || '미상'] || 0) + p.ar, z), {}))
    .sort((a, b) => b[1] - a[1]).slice(0, 3).map(([k, v]) => `${k.replace('지역', '')} ${pct(v / ar)}`).join('<br>');
  const r = no / nb, ok = r >= AGING;
  const row = (k, v) => `<tr><td>${k}</td><td>${v}</td></tr>`;
  $('panel').innerHTML = `<button class="x" onclick="$('panel').style.display='none'">×</button><h3>선택 구역 분석</h3>
    <div style="margin-bottom:10px">노후도 <b style="font-size:20px">${pct(r)}</b>
      <span class="badge" style="background:var(--${ok ? 'ok' : 'bad'})">${ok ? '요건 충족' : '요건 미달'} (기준 ${pct(AGING)})</span></div>
    <table>
      ${row('구역 면적', `${fmt(Math.round(ha * 1e4))}㎡ (${ha.toFixed(2)}ha)`)}
      ${row('필지 수', fmt(S.length))}
      ${row('건축물 (주건축물)', `${fmt(nb)}동`)}
      ${row('노후 · 미상', `${fmt(no)}동 · ${fmt(nu)}동`)}
      ${row('미상 포함 시 노후도', pct((no + nu) / nb))}
      ${row('노후 연면적 비율', pct(sum('oa') / sum('ta')))}
      ${row('호수밀도', `${(nb / ha).toFixed(1)}동/ha`)}
      ${row('과소필지 (대지 90㎡ 미만)', `${small} / ${dae.length} (${pct(small / dae.length)})`)}
      ${row('추정 토지등소유자', lo === hi ? `${fmt(lo)}명` : `${fmt(lo)} ~ ${fmt(hi)}명`)}
      ${row('현재 세대·가구 / 집합 호수', `${fmt(sum('hh'))} / ${fmt(sum('ho'))}`)}
      ${row('최근 5년 신축', `${fmt(sum('nn'))}동`)}
      ${row('국공유지 면적', pct(pubAr / ar))}
      ${row('용도지역', zones || '–')}
    </table>
    <div class="note">소유자 수는 공개 집계 기반 추정치입니다. 한 사람이 여러 필지·호를 가진 경우를 구분하지 못해 실제보다 많게 나올 수 있습니다.
      ${est ? `소유정보가 없는 ${est}필지는 집합 호수(또는 1명)로 대체했습니다.` : ''} 정비구역 지정 여부는 고시문으로 확인하세요.</div>`;
  $('panel').style.display = 'block';
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
