# 지역: 키 이름 또는 시군구코드(쉼표 구분)로 실행  예) python -m pipeline.fetch seoul,seongnam
regions:
  test: [11650]                      # 서초구
  seeded: [11650, 11680, 11710, 11170, 11200, 11215]  # 지적도 파일 올린 구: 서초·강남·송파·용산·성동·광진
  seoul: [11110, 11140, 11170, 11200, 11215, 11230, 11260, 11290, 11305, 11320, 11350, 11380, 11410,
          11440, 11470, 11500, 11530, 11545, 11560, 11590, 11620, 11650, 11680, 11710, 11740]
  seongnam: [41131, 41133, 41135]    # 수정구, 중원구, 분당구

rules:
  base_year: null                    # null = 올해 기준
  old_years: {rc: 30, other: 20}     # 노후·불량 경과연수 (철근콘크리트·철골계 / 그 외) — 조례 확인 후 조정
  rc_keywords: [콘크리트, 철골, 강구조]
  aging_threshold: 0.60              # 재개발 노후도 요건 (재정비촉진지구 0.50)
  small_parcel_m2: 90                # 과소필지
  new_years: 5                       # 최근 N년 신축 = 지분쪼개기 위험 신호
