name: probe
on:
  workflow_dispatch:
    inputs:
      args: { description: '추가로 시도할 서비스명', default: 'upisRebuild' }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests && python tools/probe_seoul.py ${{ inputs.args }}
        env: { SEOUL_API_KEY: '${{ secrets.SEOUL_API_KEY }}' }
