name: pipeline

on:
  push:                    # 코드·설정이 바뀌면 자동 실행 (지역은 저장소 변수 REGION, 없으면 seeded)
    branches: [main]
    paths: ['pipeline/**', 'site/**', 'config.yaml', 'data/seed/**', '.github/workflows/pipeline.yml']
  workflow_dispatch:
    inputs:
      region:
        description: 'config.yaml 지역 키 또는 시군구코드 (예: test / seoul / seoul,seongnam / 11650)'
        default: seeded
  schedule:
    - cron: '0 18 1 * *'   # 매월 2일 03:00 KST

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: { group: pipeline, cancel-in-progress: false }   # 구가 연달아 올라와도 진행 중인 빌드는 끝까지 (대기 중인 건 최신 것 하나만 남음)

jobs:
  build:
    runs-on: ubuntu-latest                  # 브이월드(해외 IP 차단)는 PC에서 받아 data/seed로 올림. 여기선 건축물대장만 수집
    timeout-minutes: 350
    env:
      REGION: ${{ inputs.region || vars.REGION || 'seeded' }}
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v4
      - name: setup
        run: |
          python3 -m venv ~/venv
          ~/venv/bin/pip install -q -r requirements.txt
          echo "$HOME/venv/bin" >> $GITHUB_PATH
      - run: python -m pytest -q tests
      - uses: actions/cache/restore@v4      # 건축물대장 캐시 (25일 이내 받은 동은 건너뜀)
        with: { path: data/raw, key: 'raw-${{ github.run_id }}', restore-keys: raw- }
      - name: fetch
        run: python -m pipeline.fetch "$REGION" bldgs 2>&1 | tee fetch.log; exit ${PIPESTATUS[0]}
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      - name: market                        # 모델용: 아파트 실거래·지하철역 (실패해도 지도 빌드는 계속)
        if: always()
        continue-on-error: true
        timeout-minutes: 90
        run: python -m pipeline.market 3000 2>&1 | tee market.log; exit ${PIPESTATUS[0]}
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
      - uses: actions/cache/save@v4         # 일부 실패해도 받은 건 저장 → 다음 실행에서 이어받음
        if: always()
        with: { path: data/raw, key: 'raw-${{ github.run_id }}' }
      - name: build
        if: always()                        # 수집이 일부 실패해도 받은 동까지는 지도에 반영
        run: python -m pipeline.build "$REGION" 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: redev                         # 정비사업 구역·단계 (서울 열린데이터광장)
        if: always()
        run: python -m pipeline.redev 2>&1 | tee redev.log; exit ${PIPESTATUS[0]}
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
          DUMP: '1'
      - uses: actions/cache@v4              # 벡터타일 도구 (한 번 빌드해 두고 재사용)
        id: tc
        with: { path: ~/tippecanoe, key: tippecanoe-2.79.0 }
      - name: tippecanoe 설치
        if: steps.tc.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y -q libsqlite3-dev zlib1g-dev >/dev/null
          git clone -q --depth 1 --branch 2.79.0 https://github.com/felt/tippecanoe.git /tmp/tc
          make -C /tmp/tc -j4 >/dev/null && mkdir -p ~/tippecanoe && cp /tmp/tc/tippecanoe ~/tippecanoe/
      - name: tiles                         # 필지 → 벡터타일 (지도에서 확대·이동이 빠름)
        if: always()
        run: |
          ~/tippecanoe/tippecanoe -q -o site/data/parcels.pmtiles -l parcels -Z14 -z15 --no-tile-size-limit --no-feature-limit \
            --no-tiny-polygon-reduction --force site/data/parcels.ndjson
          rm site/data/parcels.ndjson; du -sh site/data/parcels.pmtiles site/data/p | tee -a build.log
      - name: report                        # 로그 끝부분을 annotation으로 남김 (로그인 없이 API로 조회 가능)
        if: always()
        run: |
          python - <<'EOF'
          import pathlib
          for n in ('fetch', 'market', 'build', 'redev'):
              p = pathlib.Path(f'{n}.log')
              if p.exists():
                  t = p.read_text(errors='replace')[-3000:].replace('%', '%25').replace('\r', '').replace('\n', '%0A')
                  print(f'::notice title={n}.log::{t}')
          EOF
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with: { path: site }

  deploy:
    needs: build
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
